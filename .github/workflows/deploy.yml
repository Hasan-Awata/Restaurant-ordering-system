name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if [ ! -d "/var/www/orderingsystem/.git" ]; then
              git clone https://github.com/Hasan-Awata/Restaurant-ordering-system /var/www/orderingsystem
            else
              cd /var/www/orderingsystem
              git pull origin main
            fi

            cd /var/www/orderingsystem
            docker-compose up -d --build